<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>River overlay editor — Trisuli</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0C1116; color: #E6ECF0;
    font: 13px/1.4 -apple-system, "Segoe UI", "Source Sans 3", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button, select, input { font: inherit; color: inherit; }
  button {
    background: #1D2831; border: 1px solid #26313A; border-radius: 6px;
    color: #E6ECF0; padding: 5px 10px; cursor: pointer;
  }
  button:hover { background: #24313C; }
  button:active { background: #1A232B; }
  button.active { background: #5FB3C4; border-color: #5FB3C4; color: #0C1116; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  select, input[type=text], input[type=number] {
    background: #1D2831; border: 1px solid #26313A; border-radius: 6px;
    color: #E6ECF0; padding: 4px 6px;
  }
  #toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 6px 10px; background: #151C23; border-bottom: 1px solid #26313A;
    user-select: none;
  }
  #toolbar .sep { width: 1px; align-self: stretch; background: #26313A; margin: 0 4px; }
  #toolbar label.fld { display: flex; align-items: center; gap: 4px; color: #8FA0AB; }
  #modMarker { color: #FFC24D; font-weight: 700; margin-left: 2px; visibility: hidden; }
  #saveStatus { color: #8FA0AB; margin-left: 4px; white-space: nowrap; }
  #selPanel { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #selSummary { color: #5FB3C4; font-weight: 600; }
  #nameInput { width: 160px; }
  #angleInput { width: 64px; }
  #mapWrap { position: relative; flex: 1; overflow: hidden; background: #05080B; touch-action: none; }
  #mapWrap canvas { position: absolute; left: 0; top: 0; display: block; }
  #statusBar {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 4px 10px; background: #151C23; border-top: 1px solid #26313A;
    color: #8FA0AB; font-size: 12px; user-select: none;
  }
  #legend { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #legend b { color: #E6ECF0; }
  [hidden] { display: none !important; }

  #floatPanel {
    position: absolute; left: 12px; top: 12px; z-index: 5;
    background: #151C23; border: 1px solid #26313A; border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.45);
    width: 172px; user-select: none;
  }
  #floatHeader {
    padding: 7px 10px; background: #1D2831; border-bottom: 1px solid #26313A;
    border-radius: 7px 7px 0 0; cursor: move; font-weight: 700; color: #8FA0AB;
    letter-spacing: .05em; text-transform: uppercase; font-size: 11px;
  }
  .floatBtns { display: flex; flex-direction: column; gap: 4px; padding: 7px; }
  .floatBtn {
    display: flex; align-items: center; gap: 9px; text-align: left;
    padding: 7px 9px; width: 100%; font-size: 13px;
  }
  .floatBtn .ic { display: inline-block; width: 20px; text-align: center; font-size: 16px; flex: none; line-height: 1; }
  .floatSep { height: 1px; background: #26313A; margin: 3px 4px; }
  .layerSwitch { display: flex; gap: 4px; padding: 7px 7px 0; }
  .layerBtn { flex: 1; padding: 6px 4px; font-size: 12px; text-align: center; }
</style>
</head>
<body>

<div id="toolbar">
  <label class="fld">BG
    <label style="display:inline-flex;align-items:center;gap:4px;margin-right:6px;color:#8FA0AB"><input type="checkbox" id="contourChk" checked> Contours</label>
    <select id="bgSelect">
      <option value="legion">5 Feb Vantor Legion (0.39m)</option>
      <option value="ps">27 May PlanetScope</option>
      <option value="s2">27 Aug Sentinel-2</option>
    </select>
  </label>
  <div class="sep"></div>
  <label class="fld">Layer
    <select id="layerSelect">
      <option value="rivers">Rivers</option>
      <option value="flood">Flood</option>
    </select>
  </label>
  <div class="sep"></div>
  <button id="loadBtn" title="Re-fetch the active layer's JSON">Load</button>
  <button id="saveBtn" title="POST the active layer to its /save endpoint">Save</button>
  <span id="modMarker">●</span>
  <span id="saveStatus"></span>
  <button id="downloadBtn" title="Download the active layer's JSON">Download JSON</button>
  <div class="sep"></div>
  <button id="undoBtn" class="undoBtnCls" title="Ctrl/Cmd+Z">Undo</button>
  <button id="redoBtn" class="redoBtnCls" title="Shift+Ctrl/Cmd+Z">Redo</button>
  <div class="sep"></div>
  <button class="toolbtn active" data-tool="select" title="1">Select</button>
  <button class="toolbtn" data-tool="moveVertex" title="2">Move vertex</button>
  <button class="toolbtn" data-tool="addVertex" title="3">Add vertex</button>
  <button class="toolbtn" data-tool="deleteVertex" title="4">Delete vertex</button>
  <button class="toolbtn" data-tool="moveFeature" title="5">Move feature</button>
  <button class="toolbtn" data-tool="deleteFeature" title="6">Delete feature</button>
  <div class="sep"></div>
  <button class="toolbtn" data-tool="poly" title="7">Draw polygon</button>
  <button class="toolbtn" data-tool="lineSolid" title="8">Draw solid line</button>
  <button class="toolbtn" data-tool="lineDashed" title="9">Draw dashed line</button>
  <button class="toolbtn" data-tool="label" title="0">Add label</button>
  <button class="toolbtn" data-tool="pan" title="P / hold Space">Pan</button>
  <button class="toolbtn" data-tool="pen" title="M — red marks for screenshots, never saved">Pen</button>
  <button id="clearMarksBtn" title="remove all pen marks">Clear marks</button>
  <button id="marksToPolyBtn" title="join the pen strokes into one closed polygon on the active layer">Marks → polygon</button>
  <button id="copyViewBtn" title="copy centre lat/lon, zoom and map link">Copy view</button>
  <div class="sep"></div>
  <button id="deleteBtn" title="Delete key — removes current selection">Delete selected</button>
  <div class="sep"></div>
  <div id="selPanel" hidden>
    <span id="selSummary"></span>
    <span id="labelFields" hidden>
      <label class="fld">Name <input id="nameInput" type="text"></label>
      <label class="fld">Angle <input id="angleInput" type="number" min="-90" max="90" step="1"></label>
      <label class="fld">Kind
        <select id="kindSelect">
          <option value="r">river</option>
          <option value="c">canal/stream</option>
          <option value="w">water body</option>
          <option value="s">small stream</option>
        </select>
      </label>
    </span>
    <span id="lineFields" hidden>
      <button id="classSolidBtn" title="Solid (canal / named stream)">Solid</button>
      <button id="classDashedBtn" title="Dashed (unnamed stream)">Dashed</button>
    </span>
  </div>
</div>

<div id="mapWrap">
  <canvas id="bgCanvas"></canvas>
  <canvas id="fgCanvas"></canvas>
  <div id="floatPanel">
    <div id="floatHeader">Edit</div>
    <div class="layerSwitch">
      <button class="layerBtn active" data-layer="rivers">Rivers</button>
      <button class="layerBtn" data-layer="flood">Flood</button>
    </div>
    <div class="floatBtns">
      <button class="toolbtn floatBtn" data-tool="select" title="1"><span class="ic">&#9678;</span>Select</button>
      <button class="toolbtn floatBtn" data-tool="moveVertex" title="2"><span class="ic">&#10021;</span>Move vertex</button>
      <button class="toolbtn floatBtn" data-tool="addVertex" title="3"><span class="ic">&#8853;</span>Add vertex</button>
      <button class="toolbtn floatBtn" data-tool="deleteVertex" title="4"><span class="ic">&#8854;</span>Delete vertex</button>
      <button class="toolbtn floatBtn" data-tool="moveFeature" title="5"><span class="ic">&#10011;</span>Move feature</button>
      <button class="toolbtn floatBtn" data-tool="deleteFeature" title="6"><span class="ic">&#10005;</span>Delete feature</button>
      <div class="floatSep"></div>
      <button class="toolbtn floatBtn" data-tool="poly" title="7"><span class="ic">&#11040;</span>Draw polygon</button>
      <button class="toolbtn floatBtn" data-tool="lineSolid" title="8"><span class="ic">&#8213;</span>Solid line</button>
      <button class="toolbtn floatBtn" data-tool="lineDashed" title="9"><span class="ic">&#9508;</span>Dashed line</button>
      <button class="toolbtn floatBtn" data-tool="label" title="0"><span class="ic">Aa</span>Add label</button>
      <button class="toolbtn floatBtn" data-tool="pan" title="P / hold Space"><span class="ic">&#9974;</span>Pan</button>
      <button class="toolbtn floatBtn" data-tool="pen" title="M"><span class="ic">&#9998;</span>Pen (marks)</button>
      <button class="floatBtn" id="clearMarksBtn2" title="remove all pen marks"><span class="ic">&#8709;</span>Clear marks</button>
      <button class="floatBtn" id="marksToPolyBtn2" title="join the pen strokes into one closed polygon on the active layer"><span class="ic">&#11039;</span>Marks &rarr; polygon</button>
      <button class="floatBtn" id="copyViewBtn2" title="copy centre lat/lon, zoom and map link"><span class="ic">&#9112;</span>Copy view</button>
      <div class="floatSep"></div>
      <button class="floatBtn undoBtnCls" title="Ctrl/Cmd+Z"><span class="ic">&#8630;</span>Undo</button>
      <button class="floatBtn redoBtnCls" title="Shift+Ctrl/Cmd+Z"><span class="ic">&#8631;</span>Redo</button>
    </div>
  </div>
</div>

<div id="statusBar">
  <span id="status"></span>
  <span id="legend">
    <b>1-0</b> modes &middot; <b>P</b> pan &middot; <b>Space</b> hold-to-pan &middot; <b>Alt+click</b>/<b>Backspace</b> delete vertex &middot;
    <b>Del</b> delete selection &middot; <b>Enter</b>/dbl-click finish draw &middot; <b>Esc</b> cancel/deselect &middot; <b>Ctrl/Cmd+Z</b> undo &middot; <b>Shift+Ctrl/Cmd+Z</b> redo
  </span>
</div>

<script>
(function () {
  "use strict";

  // ============================== state ==============================
  var BOX = { x0: 20435, y0: 18685, x1: 21899, y1: 20482, w: 1464, h: 1797 };
  var MPP = 2.93; // metres per world px

  // Two editable layers share all the same tools/hit-testing/undo machinery below. `data` always
  // points at the ACTIVE layer's editor object (polys/lines/labels[, extra keys for rivers]) —
  // reassigned by setLayer()/undo()/redo()/loadLayer(), mutated in place everywhere else — so the
  // rest of the file (selection, drawing, mutation helpers) is unaware layers even exist.
  var layers = {
    rivers: {
      data: { polys: [], lines: [], labels: [], source: "" },
      extra: {}, undoStack: [], redoStack: [], modified: false,
      url: "assets/trisuli/rivers.json", saveUrl: "/save/rivers", isPolyOnly: false,
      toSavePayload: function () { return this.data; }
    },
    flood: {
      data: { polys: [], lines: [], labels: [] },
      extra: {}, undoStack: [], redoStack: [], modified: false,
      url: "assets/trisuli/flood.json", saveUrl: "/save/flood", isPolyOnly: true,
      toSavePayload: function () {
        var out = {}; Object.keys(this.extra).forEach(function (k) { out[k] = this.extra[k]; }, this);
        out.path = this.data.polys; return out;
      }
    }
  };
  var activeLayer = "rivers";
  var LAYER_STYLES = {
    rivers: { fill: "rgba(0,210,255,0.22)", stroke: "rgba(0,230,255,0.95)", polyLineWidth: 1.5, lineFill: "rgba(0,230,255,0.85)", labelFill: "#9BE4FA" },
    flood: { fill: "rgba(255,50,40,0.28)", stroke: "rgba(255,64,56,0.95)", polyLineWidth: 1.6, lineFill: "rgba(255,64,56,0.85)", labelFill: "#FFD9D6" }
  };
  function anyModified() { return layers.rivers.modified || layers.flood.modified; }

  var data = layers.rivers.data;

  var view = { scale: 1, panX: 0, panY: 0 };
  var SCALE_MIN = 0.3, SCALE_MAX = 12;
  var VERTEX_HIT_RADIUS = 9;   // px, screen-space hit radius for vertex handles
  var VERTEX_HANDLE_SIZE = 7;  // px, rendered handle square size
  var EDGE_HIT_RADIUS = 6;     // px, screen-space hit distance for edges/strokes

  var tool = "select";
  var selection = null;      // { type: 'poly'|'line'|'label', index, vertex }
  var dragMode = null;       // active drag/edit session
  var panDrag = null;
  var floatDrag = null;      // floating panel reposition drag
  var draft = null;          // { kind:'poly'|'lineSolid'|'lineDashed', pts:[...] }
  var marks = [];            // pen strokes in world px [x,y,x,y,...] — screenshot annotations, never saved
  var penStroke = null;
  var cursorWorld = null;
  var spaceHeld = false;
  var justPanned = false;
  var fieldArmed = false;
  var bgMode = "legion";

  var TOOL_LABELS = {
    select: "Select", moveVertex: "Move vertex", addVertex: "Add vertex", deleteVertex: "Delete vertex",
    moveFeature: "Move feature", deleteFeature: "Delete feature",
    poly: "Draw polygon", lineSolid: "Draw solid line", lineDashed: "Draw dashed line",
    label: "Add label", pan: "Pan"
  };

  // ============================== dom ==============================
  var els = {};
  function cacheDom() {
    els.toolbar = document.getElementById("toolbar");
    els.bgSelect = document.getElementById("bgSelect");
    els.layerSelect = document.getElementById("layerSelect");
    els.loadBtn = document.getElementById("loadBtn");
    els.saveBtn = document.getElementById("saveBtn");
    els.modMarker = document.getElementById("modMarker");
    els.saveStatus = document.getElementById("saveStatus");
    els.downloadBtn = document.getElementById("downloadBtn");
    els.undoBtn = document.getElementById("undoBtn");
    els.redoBtn = document.getElementById("redoBtn");
    els.deleteBtn = document.getElementById("deleteBtn");
    els.selPanel = document.getElementById("selPanel");
    els.selSummary = document.getElementById("selSummary");
    els.labelFields = document.getElementById("labelFields");
    els.lineFields = document.getElementById("lineFields");
    els.nameInput = document.getElementById("nameInput");
    els.angleInput = document.getElementById("angleInput");
    els.kindSelect = document.getElementById("kindSelect");
    els.classSolidBtn = document.getElementById("classSolidBtn");
    els.classDashedBtn = document.getElementById("classDashedBtn");
    els.mapWrap = document.getElementById("mapWrap");
    els.bgCanvas = document.getElementById("bgCanvas");
    els.fgCanvas = document.getElementById("fgCanvas");
    els.status = document.getElementById("status");
    els.floatPanel = document.getElementById("floatPanel");
    els.floatHeader = document.getElementById("floatHeader");
  }
  var mapWrap, bgCanvas, fgCanvas;

  // ============================== world <-> geo ==============================
  function worldToLonLat(x, y) {
    return { lon: 84.52 + x / 36169 * 1.08, lat: 28.45 - y / 28011 * 0.75 };
  }

  // ============================== history ==============================
  // Undo/redo stacks are per-layer (layers[name].undoStack/redoStack), so undo always operates
  // on the layer that is currently active and can never restore a stale copy of the other layer.
  function pushHistory() {
    var L = layers[activeLayer];
    L.undoStack.push(JSON.stringify(data));
    if (L.undoStack.length > 100) L.undoStack.shift();
    L.redoStack.length = 0;
    L.modified = true;
    updateModifiedMarker();
    syncUndoRedoButtons();
  }
  // undo/redo swap the whole data object; a selection that still points at a feature that
  // exists in the restored snapshot is kept (this is what lets you drag/undo/keep-editing the
  // same feature across mode switches). A stale vertex index is cleared since positions may
  // have shifted; a selection whose feature no longer exists (an add/delete was undone) is cleared.
  function keepSelectionIfValid() {
    if (!selection) return;
    var arr = selection.type === "poly" ? data.polys : selection.type === "line" ? data.lines : data.labels;
    if (!arr || selection.index < 0 || selection.index >= arr.length) selection = null;
    else selection.vertex = null;
  }
  function undo() {
    var L = layers[activeLayer];
    if (!L.undoStack.length) return;
    L.redoStack.push(JSON.stringify(data));
    data = JSON.parse(L.undoStack.pop());
    L.data = data;
    dragMode = null; draft = null;
    keepSelectionIfValid();
    L.modified = true; updateModifiedMarker(); syncUndoRedoButtons();
    refreshSelectionFields(); markDirty();
  }
  function redo() {
    var L = layers[activeLayer];
    if (!L.redoStack.length) return;
    L.undoStack.push(JSON.stringify(data));
    data = JSON.parse(L.redoStack.pop());
    L.data = data;
    dragMode = null; draft = null;
    keepSelectionIfValid();
    L.modified = true; updateModifiedMarker(); syncUndoRedoButtons();
    refreshSelectionFields(); markDirty();
  }
  function updateModifiedMarker() {
    els.modMarker.style.visibility = anyModified() ? "visible" : "hidden";
  }
  function syncUndoRedoButtons() {
    var L = layers[activeLayer];
    var canUndo = L.undoStack.length > 0, canRedo = L.redoStack.length > 0;
    document.querySelectorAll(".undoBtnCls").forEach(function (b) { b.disabled = !canUndo; });
    document.querySelectorAll(".redoBtnCls").forEach(function (b) { b.disabled = !canRedo; });
  }

  // ============================== render loop ==============================
  var dirty = true, rafScheduled = false;
  function markDirty() { dirty = true; scheduleRender(); }
  function scheduleRender() {
    if (rafScheduled) return;
    rafScheduled = true;
    requestAnimationFrame(function () {
      rafScheduled = false;
      if (dirty) { dirty = false; render(); }
    });
  }

  function resizeCanvases() {
    var dpr = window.devicePixelRatio || 1;
    var w = mapWrap.clientWidth, h = mapWrap.clientHeight;
    [bgCanvas, fgCanvas].forEach(function (c) {
      var nw = Math.round(w * dpr), nh = Math.round(h * dpr);
      if (c.width !== nw || c.height !== nh) {
        c.width = nw; c.height = nh;
        c.style.width = w + "px"; c.style.height = h + "px";
      }
    });
  }

  function render() {
    resizeCanvases();
    var dpr = window.devicePixelRatio || 1;
    var w = mapWrap.clientWidth, h = mapWrap.clientHeight;
    var bctx = bgCanvas.getContext("2d");
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bctx.clearRect(0, 0, w, h);
    renderBackground(bctx, w, h);
    if (contoursOn) drawContourLines(bctx, w, h);
    var fctx = fgCanvas.getContext("2d");
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fctx.clearRect(0, 0, w, h);
    renderOverlay(fctx, w, h);
  }

  // ============================== tile layer / backgrounds ==============================
  function makeTileLayer(dir) {
    var loaded = false, loading = false, levels = [], overview = null;
    var cache = {};
    function img(src) {
      var im = cache[src];
      if (!im) {
        im = new Image(); im.decoding = "async";
        im.onload = markDirty;
        cache[src] = im; im.src = src;
      }
      return im;
    }
    function ensure() {
      if (loaded || loading) return;
      loading = true;
      fetch(dir + "/index.json").then(function (r) { return r.json(); }).then(function (j) {
        (j.levels || []).forEach(function (L) {
          var keySet = {}; (L.tiles || []).forEach(function (k) { keySet[k] = true; });
          levels.push({ F: L.F, T: L.T, dir: dir + "/" + L.dir, minScale: L.minScale || 0, keySet: keySet });
        });
        if (j.overview) {
          var o = j.overview;
          overview = { img: img(dir + "/" + o.src), left: o.left, top: o.top, width: o.width, height: o.height };
        }
        loaded = true; markDirty();
      }).catch(function () { loading = false; });
    }
    function draw(ctx) {
      ensure();
      if (overview && overview.img.complete && overview.img.naturalWidth) {
        ctx.drawImage(overview.img,
          overview.left * view.scale + view.panX, overview.top * view.scale + view.panY,
          overview.width * view.scale, overview.height * view.scale);
      }
      if (!loaded) return;
      var narrow = window.innerWidth < 640;
      var active = levels.filter(function (L) { return view.scale >= L.minScale && !(narrow && L.F === 8); });
      active.sort(function (a, b) { return a.F - b.F; });
      var w = mapWrap.clientWidth, h = mapWrap.clientHeight;
      active.forEach(function (L) {
        var T = L.T;
        var wx0 = -view.panX / view.scale, wy0 = -view.panY / view.scale;
        var wx1 = (w - view.panX) / view.scale, wy1 = (h - view.panY) / view.scale;
        var tx0 = Math.floor(wx0 / T), tx1 = Math.floor(wx1 / T);
        var ty0 = Math.floor(wy0 / T), ty1 = Math.floor(wy1 / T);
        for (var tx = tx0; tx <= tx1; tx++) {
          for (var ty = ty0; ty <= ty1; ty++) {
            var key = tx + "_" + ty;
            if (!L.keySet[key]) continue;
            var im = img(L.dir + "/" + key + ".webp");
            if (im.complete && im.naturalWidth) {
              ctx.drawImage(im, tx * T * view.scale + view.panX, ty * T * view.scale + view.panY,
                T * view.scale, T * view.scale);
            }
          }
        }
      });
    }
    return { draw: draw };
  }
  var tileLayer = makeTileLayer("assets/trisuli/tiles/vantor_pre");
  var psImage = null, s2Image = null;
  function ensureBgImage(which) {
    if (which === "ps" && !psImage) { psImage = new Image(); psImage.onload = markDirty; psImage.src = "assets/trisuli/pre_ps_sr_20260527.webp"; }
    if (which === "s2" && !s2Image) { s2Image = new Image(); s2Image.onload = markDirty; s2Image.src = "assets/trisuli/post_s2_20260827.jpg"; }
  }
  // ---- contour lines (Copernicus GLO-30, pre-cut to the box) drawn over the imagery ----
  var contoursOn = true, contourSets = {}, contourLoading = {};
  var CONTOUR_CLASSES = [
    { key: "div1000", url: "assets/trisuli/contours/div1000.json", zmin: 0, w: 1.4, a: 0.7 },
    { key: "div500", url: "assets/trisuli/contours/div500.json", zmin: 11, w: 1.4, a: 0.7 },
    { key: "div200", url: "assets/trisuli/contours/div200.json", zmin: 12, w: 1.3, a: 0.65 },
    { key: "div100", url: "assets/trisuli/contours/div100.json", zmin: 13, w: 0.9, a: 0.55 },
    { key: "div50", url: "assets/trisuli/contours/div50.json", zmin: 13.5, w: 0.8, a: 0.45 },
    { key: "div10", url: "assets/trisuli/contours/div10/4_4.json", zmin: 15, w: 0.6, a: 0.35 }
  ];
  function ensureContours(c) {
    if (contourSets[c.key] || contourLoading[c.key]) return;
    contourLoading[c.key] = true;
    fetch(c.url).then(function (r) { return r.json(); }).then(function (j) { contourSets[c.key] = j.lines || []; markDirty(); }).catch(function () { contourSets[c.key] = []; });
  }
  function drawContourLines(ctx, w, h) {
    var z = 13 + Math.log2(view.scale / 0.174);
    var wx0 = -view.panX / view.scale, wy0 = -view.panY / view.scale, wx1 = (w - view.panX) / view.scale, wy1 = (h - view.panY) / view.scale;
    ctx.save(); ctx.lineJoin = "round"; ctx.lineCap = "round";
    CONTOUR_CLASSES.forEach(function (c) {
      if (z < c.zmin) return;
      ensureContours(c);
      var lines = contourSets[c.key]; if (!lines) return;
      ctx.lineWidth = c.w; ctx.globalAlpha = c.a; ctx.strokeStyle = c.key === "div1000" || c.key === "div500" ? "#B87333" : "#C89A5B";
      ctx.beginPath();
      lines.forEach(function (L) {

  // currently active is only ever drawn (dimmed); it is never touched by hit-testing.
  function setLayer(name) {
    if (!layers[name] || name === activeLayer) return;
    dragMode = null; draft = null; panDrag = null;
    activeLayer = name;
    data = layers[name].data;
    selection = null;
    if (layers[name].isPolyOnly && (tool === "lineSolid" || tool === "lineDashed" || tool === "label")) setTool("select");
    updateDrawToolAvailability();
    updateLayerUI();
    updateModifiedMarker();
    syncUndoRedoButtons();
    refreshSelectionFields();
    markDirty();
  }
  function updateLayerUI() {
    els.layerSelect.value = activeLayer;
    document.querySelectorAll(".layerBtn").forEach(function (b) {
      b.classList.toggle("active", b.dataset.layer === activeLayer);
    });
  }
  function updateDrawToolAvailability() {
    var floodOnly = layers[activeLayer].isPolyOnly;
    document.querySelectorAll('.toolbtn[data-tool="lineSolid"], .toolbtn[data-tool="lineDashed"], .toolbtn[data-tool="label"]')
      .forEach(function (b) { b.disabled = floodOnly; });
  }

  function refreshSelectionFields() {
    if (!selection) {
      els.selPanel.hidden = true;
      updateStatus();
      return;
    }
    els.selPanel.hidden = false;
    if (selection.type === "poly") {
      var ring = data.polys[selection.index];
      els.selSummary.textContent = "Polygon #" + selection.index + " (" + (ring.length / 2) + " pts)";
      els.labelFields.hidden = true; els.lineFields.hidden = true;
    } else if (selection.type === "line") {
      var L = data.lines[selection.index];
      els.selSummary.textContent = "Line #" + selection.index + " (" + (L.c === "c" ? "solid" : "dashed") + ", " + (L.p.length / 2) + " pts)";
      els.lineFields.hidden = false; els.labelFields.hidden = true;
      els.classSolidBtn.classList.toggle("active", L.c === "c");
      els.classDashedBtn.classList.toggle("active", L.c === "s");
    } else if (selection.type === "label") {
      var lab = data.labels[selection.index];
      els.selSummary.textContent = 'Label "' + lab[3] + '" (' + lab[4] + ", " + lab[2] + "°)";
      els.labelFields.hidden = false; els.lineFields.hidden = true;
      if (document.activeElement !== els.nameInput) els.nameInput.value = lab[3];
      if (document.activeElement !== els.angleInput) els.angleInput.value = lab[2];
      els.kindSelect.value = lab[4];
    }
    updateStatus();
  }
  function armFieldHistory() { fieldArmed = true; }
  function fireFieldHistory() { if (fieldArmed) { pushHistory(); fieldArmed = false; } }
  function applyLabelField() {
    if (!selection || selection.type !== "label") return;
    var lab = data.labels[selection.index];
    lab[3] = els.nameInput.value;
    var a = parseFloat(els.angleInput.value);
    if (isNaN(a)) a = 0;
    a = Math.max(-90, Math.min(90, a));
    lab[2] = a;
    lab[4] = els.kindSelect.value;
    markDirty();
  }

  function updateStatus() {
    var parts = [];
    if (cursorWorld) {
      var ll = worldToLonLat(cursorWorld.x, cursorWorld.y);
      parts.push("lon " + ll.lon.toFixed(5) + ", lat " + ll.lat.toFixed(5));
      parts.push("px " + cursorWorld.x.toFixed(1) + ", " + cursorWorld.y.toFixed(1));
    }
    parts.push("tool: " + TOOL_LABELS[tool]);
    parts.push(selection ? els.selSummary.textContent : "no selection");
    els.status.textContent = parts.join("   •   ");
  }

  // ============================== view / navigation ==============================
  function fitView() {
    var margin = 20;
    var availW = mapWrap.clientWidth - margin * 2;
    var availH = mapWrap.clientHeight - margin * 2;
    var s = Math.min(availW / BOX.w, availH / BOX.h);
    view.scale = Math.max(SCALE_MIN, Math.min(SCALE_MAX, s));
    view.panX = margin + (availW - BOX.w * view.scale) / 2 - BOX.x0 * view.scale;
    view.panY = margin + (availH - BOX.h * view.scale) / 2 - BOX.y0 * view.scale;
  }

  // ============================== io ==============================
  function downloadJSON(text, filename) {
    var blob = new Blob([text], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename || "data.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function nowTimeStr() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return p(d.getHours()) + ":" + p(d.getMinutes());
  }
  // Save/Load/Download always act on the ACTIVE layer only.
  function doSave() {
    var name = activeLayer, L = layers[name];
    var body = JSON.stringify(L.toSavePayload());
    els.saveStatus.textContent = "Saving…";
    fetch(L.saveUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: body })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function () {
        L.modified = false; updateModifiedMarker();
        els.saveStatus.textContent = "Saved " + name + " ✓ " + nowTimeStr();
      })
      .catch(function (err) {
        downloadJSON(body, name + ".json");
        els.saveStatus.textContent = "Save failed (" + err.message + ") — downloaded " + name + ".json instead";
      });
  }
  // Loads one layer's JSON from disk, converting flood's {path, ...} file shape to the internal
  // {polys, lines, labels} editor shape (extra keys like `meta` are stashed on L.extra and merged
  // back in on save); rivers' file shape already IS the editor shape, so it's used as-is.
  function loadLayer(name) {
    var L = layers[name];
    fetch(L.url + "?v=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (name === "flood") {
          L.data = { polys: Array.isArray(j.path) ? j.path : [], lines: [], labels: [] };
          var extra = {};
          Object.keys(j).forEach(function (k) { if (k !== "path") extra[k] = j[k]; });
          L.extra = extra;
        } else {
          if (!Array.isArray(j.polys)) j.polys = [];
          if (!Array.isArray(j.lines)) j.lines = [];
          if (!Array.isArray(j.labels)) j.labels = [];
          L.data = j;
          L.extra = {};
        }
        L.undoStack = []; L.redoStack = []; L.modified = false;
        if (name === activeLayer) {
          data = L.data;
          selection = null;
          updateModifiedMarker(); refreshSelectionFields(); syncUndoRedoButtons();
        }
        els.saveStatus.textContent = "Loaded " + name;
        markDirty();
      })
      .catch(function (err) {
        els.saveStatus.textContent = "Load failed (" + name + "): " + err.message;
      });
  }

  // ============================== events ==============================
  function isPanTrigger(e) { return tool === "pan" || spaceHeld || e.button === 1 || e.button === 2; }

  function bindEvents() {
    els.bgSelect.addEventListener("change", function () { setBgMode(this.value); });
    document.getElementById("contourChk").addEventListener("change", function () { contoursOn = this.checked; markDirty(); });
    els.layerSelect.addEventListener("change", function () { setLayer(this.value); });
    document.querySelectorAll(".layerBtn").forEach(function (b) {
      b.addEventListener("click", function () { setLayer(this.dataset.layer); });
    });
    els.loadBtn.addEventListener("click", function () {
      if (layers[activeLayer].modified && !window.confirm("Discard unsaved changes to " + activeLayer + " and reload?")) return;
      loadLayer(activeLayer);
    });
    els.saveBtn.addEventListener("click", doSave);
    els.downloadBtn.addEventListener("click", function () {
      downloadJSON(JSON.stringify(layers[activeLayer].toSavePayload()), activeLayer + ".json");
      els.saveStatus.textContent = "Downloaded " + activeLayer + ".json";
    });
    document.querySelectorAll(".undoBtnCls").forEach(function (b) { b.addEventListener("click", undo); });
    document.querySelectorAll(".redoBtnCls").forEach(function (b) { b.addEventListener("click", redo); });
    els.deleteBtn.addEventListener("click", deleteSelectedFeature);
    document.querySelectorAll(".toolbtn[data-tool]").forEach(function (b) {
      b.addEventListener("click", function () { setTool(this.dataset.tool); });
    });
    els.classSolidBtn.addEventListener("click", function () { setLineClass("c"); });
    els.classDashedBtn.addEventListener("click", function () { setLineClass("s"); });
    els.nameInput.addEventListener("focus", armFieldHistory);
    els.nameInput.addEventListener("input", function () { fireFieldHistory(); applyLabelField(); refreshLabelSummaryOnly(); });
    els.angleInput.addEventListener("focus", armFieldHistory);
    els.angleInput.addEventListener("input", function () { fireFieldHistory(); applyLabelField(); refreshLabelSummaryOnly(); });
    els.kindSelect.addEventListener("focus", armFieldHistory);
    els.kindSelect.addEventListener("change", function () { fireFieldHistory(); applyLabelField(); refreshLabelSummaryOnly(); });

    window.addEventListener("beforeunload", function (e) {
      if (anyModified()) { e.preventDefault(); e.returnValue = ""; }
    });
    window.addEventListener("resize", function () { markDirty(); });

    mapWrap.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    mapWrap.addEventListener("wheel", function (e) {
      e.preventDefault();
      var rect = mapWrap.getBoundingClientRect();
      var sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      var wx = (sx - view.panX) / view.scale, wy = (sy - view.panY) / view.scale;
      var factor = Math.pow(1.0015, -e.deltaY);
      var ns = Math.max(SCALE_MIN, Math.min(SCALE_MAX, view.scale * factor));
      view.panX = sx - wx * ns; view.panY = sy - wy * ns; view.scale = ns;
      markDirty(); updateStatus();
    }, { passive: false });

    mapWrap.addEventListener("mousedown", function (e) {
      var rect = mapWrap.getBoundingClientRect();
      var sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      if (isPanTrigger(e)) {
        e.preventDefault();
        panDrag = { startSX: sx, startSY: sy, startPanX: view.panX, startPanY: view.panY };
        mapWrap.style.cursor = "grabbing";
        return;
      }
      if (e.button !== 0) return;
      var wx = (sx - view.panX) / view.scale, wy = (sy - view.panY) / view.scale;
      switch (tool) {
        case "select": doSelectClick(wx, wy); break;
        case "moveVertex": doMoveVertexDown(wx, wy); break;
        case "addVertex": doAddVertexDown(wx, wy); break;
        case "deleteVertex": doDeleteVertexDown(wx, wy); break;
        case "moveFeature": doMoveFeatureDown(sx, sy, wx, wy); break;
        case "deleteFeature": doDeleteFeatureDown(wx, wy); break;
        case "pen": penStroke = [wx, wy]; marks.push(penStroke); markDirty(); break;
      }
    });
    els.floatHeader.addEventListener("mousedown", function (e) {
      var panelRect = els.floatPanel.getBoundingClientRect();
      var wrapRect = mapWrap.getBoundingClientRect();
      floatDrag = {
        startX: e.clientX, startY: e.clientY,
        startLeft: panelRect.left - wrapRect.left, startTop: panelRect.top - wrapRect.top
      };
      e.preventDefault();
    });
    // stop panel interactions (drag / button clicks) from also reaching the map underneath
    ["mousedown", "click", "dblclick", "wheel"].forEach(function (evt) {
      els.floatPanel.addEventListener(evt, function (e) { e.stopPropagation(); });
    });
    window.addEventListener("mousemove", function (e) {
      if (floatDrag) {
        var nx = floatDrag.startLeft + (e.clientX - floatDrag.startX);
        var ny = floatDrag.startTop + (e.clientY - floatDrag.startY);
        nx = Math.max(0, Math.min(mapWrap.clientWidth - els.floatPanel.offsetWidth, nx));
        ny = Math.max(0, Math.min(mapWrap.clientHeight - els.floatPanel.offsetHeight, ny));
        els.floatPanel.style.left = nx + "px"; els.floatPanel.style.top = ny + "px";
        return;
      }
      if (penStroke) {
        var pr = mapWrap.getBoundingClientRect();
        penStroke.push((e.clientX - pr.left - view.panX) / view.scale, (e.clientY - pr.top - view.panY) / view.scale);
        markDirty();
        return;
      }
      var rect = mapWrap.getBoundingClientRect();
      var sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      var wx = (sx - view.panX) / view.scale, wy = (sy - view.panY) / view.scale;
      cursorWorld = { x: wx, y: wy };
      if (panDrag) {
        view.panX = panDrag.startPanX + (sx - panDrag.startSX);
        view.panY = panDrag.startPanY + (sy - panDrag.startSY);
        justPanned = true;
        markDirty(); return;
      }
      if (dragMode) { handleDragMove(wx, wy); markDirty(); return; }
      if (draft) { markDirty(); }
      updateStatus();
    });
    window.addEventListener("mouseup", function () {
      penStroke = null;
      if (floatDrag) { floatDrag = null; return; }
      if (panDrag) {
        panDrag = null;
        mapWrap.style.cursor = tool === "pan" ? "grab" : (tool === "select" ? "default" : "crosshair");
        setTimeout(function () { justPanned = false; }, 0);
        return;
      }
      if (dragMode) { finalizeDragMode(); dragMode = null; markDirty(); }
    });
    mapWrap.addEventListener("click", function (e) {
      if (justPanned) { justPanned = false; return; }
      if (tool !== "poly" && tool !== "lineSolid" && tool !== "lineDashed" && tool !== "label") return;
      var rect = mapWrap.getBoundingClientRect();
      var sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      var wx = (sx - view.panX) / view.scale, wy = (sy - view.panY) / view.scale;
      if (tool === "poly" || tool === "lineSolid" || tool === "lineDashed") {
        if (!draft) draft = { kind: tool, pts: [] };
        draft.pts.push(wx, wy);
        markDirty();
      } else if (tool === "label") {
        var name = window.prompt("Label name:");
        if (name && name.trim()) {
          pushHistory();
          data.labels.push([wx, wy, 0, name.trim(), "c"]);
          selection = { type: "label", index: data.labels.length - 1, vertex: null };
          setTool("select");
          refreshSelectionFields();
        }
        markDirty();
      }
    });
    mapWrap.addEventListener("dblclick", function (e) {
      if (!draft) return;
      e.preventDefault();
      var pts = draft.pts;
      if (pts.length >= 4) {
        var n = pts.length;
        var dx = pts[n - 2] - pts[n - 4], dy = pts[n - 1] - pts[n - 3];
        if (Math.sqrt(dx * dx + dy * dy) * view.scale < 4) pts.length -= 2;
      }
      finishDraft();
    });

    function clearMarks() { marks = []; penStroke = null; markDirty(); }
    function copyView() {
      var cx = (mapWrap.clientWidth / 2 - view.panX) / view.scale, cy = (mapWrap.clientHeight / 2 - view.panY) / view.scale;
      var lon = 84.52 + 1.08 * cx / 36169, lat = 28.45 - 0.75 * cy / 28011;
      var txt = lat.toFixed(5) + ", " + lon.toFixed(5) + "  zoom " + view.scale.toFixed(2) +
                "  index.html#m=swipe&z=" + view.scale.toFixed(3) + "&c=" + lat.toFixed(5) + "," + lon.toFixed(5);
      var done = function () { els.saveStatus.textContent = "Copied: " + txt; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, done); else done();
    }
    ["clearMarksBtn", "clearMarksBtn2"].forEach(function (id) { var b = document.getElementById(id); if (b) b.addEventListener("click", clearMarks); });
    // pen strokes -> one closed polygon on the active layer: chain strokes end-to-end by nearest
    // endpoint (reversing when needed), thin out near-duplicate points, close the ring
    function marksToPolygon() {
      var strokes = marks.filter(function (m) { return m.length >= 4; }).map(function (m) { return m.slice(); });
      if (!strokes.length) { els.saveStatus.textContent = "No pen marks to convert"; return; }
      strokes.sort(function (a, b) { return b.length - a.length; });
      var chain = strokes.shift();
      while (strokes.length) {
        var ex = chain[chain.length - 2], ey = chain[chain.length - 1], best = -1, bestD = Infinity, rev = false;
        strokes.forEach(function (st, i) {
          var d0 = Math.hypot(st[0] - ex, st[1] - ey), d1 = Math.hypot(st[st.length - 2] - ex, st[st.length - 1] - ey);
          if (d0 < bestD) { bestD = d0; best = i; rev = false; }
          if (d1 < bestD) { bestD = d1; best = i; rev = true; }
        });
        var nxt = strokes.splice(best, 1)[0];
        if (rev) { var r = []; for (var i = nxt.length - 2; i >= 0; i -= 2) r.push(nxt[i], nxt[i + 1]); nxt = r; }
        chain = chain.concat(nxt);
      }
      var pts = [chain[0], chain[1]];
      for (var k = 2; k < chain.length; k += 2) {
        if (Math.hypot(chain[k] - pts[pts.length - 2], chain[k + 1] - pts[pts.length - 1]) >= 1.5) pts.push(chain[k], chain[k + 1]);
      }
      if (pts.length >= 4 && Math.hypot(pts[0] - pts[pts.length - 2], pts[1] - pts[pts.length - 1]) < 1.5) pts.length -= 2;
      if (pts.length < 6) { els.saveStatus.textContent = "Marks too short for a polygon"; return; }
      pushHistory();
      data.polys.push(pts);
      selection = { type: "poly", index: data.polys.length - 1, vertex: null };
      marks = []; penStroke = null;
      setTool("select"); refreshSelectionFields(); markDirty();
      els.saveStatus.textContent = "Marks converted to a " + (pts.length / 2) + "-point polygon on " + activeLayer + " (unsaved)";
    }
    ["marksToPolyBtn", "marksToPolyBtn2"].forEach(function (id) { var b = document.getElementById(id); if (b) b.addEventListener("click", marksToPolygon); });
    ["copyViewBtn", "copyViewBtn2"].forEach(function (id) { var b = document.getElementById(id); if (b) b.addEventListener("click", copyView); });
    window.addEventListener("keydown", function (e) {
      if ((e.key === "m" || e.key === "M") && !e.metaKey && !e.ctrlKey && document.activeElement.tagName !== "INPUT") { setTool("pen"); return; }
      var tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
        e.preventDefault();
        if (e.shiftKey) redo(); else undo();
        return;
      }
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      switch (e.key) {
        case "1": setTool("select"); break;
        case "2": setTool("moveVertex"); break;
        case "3": setTool("addVertex"); break;
        case "4": setTool("deleteVertex"); break;
        case "5": setTool("moveFeature"); break;
        case "6": setTool("deleteFeature"); break;
        case "7": setTool("poly"); break;
        case "8": setTool("lineSolid"); break;
        case "9": setTool("lineDashed"); break;
        case "0": setTool("label"); break;
        case "p": case "P": setTool("pan"); break;
        case "Delete": e.preventDefault(); deleteSelectedFeature(); break;
        case "Backspace":
          e.preventDefault();
          if (selection && selection.vertex != null) deleteVertex(selection.vertex);
          break;
        case "Escape":
          if (draft) { draft = null; markDirty(); }
          else { selection = null; refreshSelectionFields(); markDirty(); }
          break;
        case "Enter": if (draft) finishDraft(); break;
        case " ": spaceHeld = true; mapWrap.style.cursor = "grab"; e.preventDefault(); break;
      }
    });
    window.addEventListener("keyup", function (e) {
      if (e.key === " ") {
        spaceHeld = false;
        mapWrap.style.cursor = tool === "pan" ? "grab" : (tool === "select" ? "default" : "crosshair");
      }
    });
  }
  function refreshLabelSummaryOnly() {
    if (selection && selection.type === "label") {
      var lab = data.labels[selection.index];
      els.selSummary.textContent = 'Label "' + lab[3] + '" (' + lab[4] + ", " + lab[2] + "°)";
    }
    updateStatus();
  }

  // ============================== debug hook ==============================
  window.__editor = {
    getData: function () { return JSON.parse(JSON.stringify(data)); },
    getState: function () {
      return {
        tool: tool,
        layer: activeLayer,
        selection: selection ? { type: selection.type, index: selection.index, vertex: selection.vertex } : null,
        scale: view.scale, panX: view.panX, panY: view.panY,
        modified: anyModified(),
        undoDepth: layers[activeLayer].undoStack.length, redoDepth: layers[activeLayer].redoStack.length
      };
    },
    getLayer: function () { return activeLayer; },
    setLayer: function (name) { setLayer(name); }
  };

  // ============================== init ==============================
  function init() {
    cacheDom();
    mapWrap = els.mapWrap; bgCanvas = els.bgCanvas; fgCanvas = els.fgCanvas;
    bindEvents();
    fitView();
    updateLayerUI();
    updateDrawToolAvailability();
    loadLayer("rivers");
    loadLayer("flood"); // loaded even though inactive, so it renders dimmed straight away
    setTool("select");
    updateStatus();
    scheduleRender();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
