<!DOCTYPE html>
<html><body style="margin:0;background:#111;display:flex;gap:6px">
<script src="images.js"></script>
<script>
var WORLD_W = 16745, WORLD_H = 25397;
var MARKERS = [
  { x: 13798, y: 5864, name: "Collapse origin (approx.)" },
  { x: 9303, y: 6431, name: "Rasuwagadhi" },
  { x: 8931, y: 7365, name: "Timure" },
  { x: 7964, y: 10726, name: "Syabrubesi" },
  { x: 3583, y: 14125, name: "Mailung" },
  { x: 2880, y: 17811, name: "Betrawati" },
  { x: 1630, y: 19700, name: "Trisuli Bazar" }
];
function panel(imgs, S, cropLeft, cropTop, viewW, viewH) {
  var d = document.createElement("div");
  d.style.cssText = "position:relative;flex:none;width:" + viewW + "px;height:" + viewH + "px;overflow:hidden;background:#05080B";
  var inner = document.createElement("div");
  inner.style.cssText = "position:absolute;left:" + (-cropLeft*S) + "px;top:" + (-cropTop*S) + "px;width:" + (WORLD_W*S) + "px;height:" + (WORLD_H*S) + "px";
  d.appendChild(inner);
  imgs.forEach(function (src) {
    var i = document.createElement("img");
    i.src = src;
    i.style.cssText = "position:absolute;left:0;top:0;width:" + WORLD_W + "px;height:" + WORLD_H + "px;transform-origin:0 0;transform:scale(" + S + ")";
    inner.appendChild(i);
  });
  MARKERS.forEach(function (m) {
    var p = document.createElement("div");
    p.style.cssText = "position:absolute;width:8px;height:8px;border-radius:50%;background:#FFD84D;border:1px solid #000;transform:translate(-50%,-50%);left:" + (m.x*S) + "px;top:" + (m.y*S) + "px";
    var t = document.createElement("div");
    t.textContent = m.name;
    t.style.cssText = "position:absolute;color:#FFE58F;font:600 10px sans-serif;background:rgba(0,0,0,.7);padding:0 3px;left:" + (m.x*S+6) + "px;top:" + (m.y*S-5) + "px";
    inner.appendChild(p); inner.appendChild(t);
  });
  document.body.appendChild(d);
}
// 28 Aug mode composite, full extent
panel([POST_S2, POST_PS28], 1180/WORLD_H, 0, 0, WORLD_W*1180/WORLD_H, 1180);
// zoom on the debris corridor / origin area
panel([POST_S2, POST_PS28], 0.21, 8600, 3600, 1000, 1180);
// zoom on Rasuwagadhi-Timure junction
panel([POST_S2, POST_PS28], 0.35, 7800, 5900, 620, 1180);
</script>
</body></html>
